name: Deploy to GitHub Pages

# 只从 main 分支发布；也允许在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 官方要求的权限组合：
# contents 读代码、pages 写托管、id-token 让 deploy-pages 拿到 OIDC 令牌
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一次发布，避免旧的构建覆盖新的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 需要 Node 20.19+ 或 22.12+
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 单元测试
        run: npm run test

      # 仓库名即子路径：/study-assistant/
      # 写死会导致 fork 或改名后白屏，所以从仓库信息里取
      - name: 构建（按子路径）
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
