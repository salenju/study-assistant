name: Deploy to GitHub Pages

# 只从 main 分支发布；也允许在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 官方要求的权限组合：
# contents 读代码、pages 写托管、id-token 让 deploy-pages 拿到 OIDC 令牌
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一次发布，避免旧的构建覆盖新的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 先确认仓库已启用 Pages。
      # 不检查的话，configure-pages 只会抛一个 404，日志里看不出该做什么。
      # 注意：configure-pages 的 enablement:true 需要 PAT 或 GitHub App 令牌，
      # 默认的 GITHUB_TOKEN 无法启用，所以这里只能提示、不能代劳。
      - name: 检查 Pages 是否已启用
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" != "200" ]; then
            echo "::error::仓库尚未启用 Pages（API 返回 $code）。请打开 https://github.com/${{ github.repository }}/settings/pages ，把 Build and deployment 的 Source 设为「GitHub Actions」，然后重跑本工作流。"
            exit 1
          fi
          echo "Pages 已启用，继续构建。"

      - uses: actions/setup-node@v7
        with:
          # Vite 8 需要 Node 20.19+ 或 22.12+
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 单元测试
        run: npm run test

      # 仓库名即子路径：/study-assistant/
      # 写死会导致 fork 或改名后白屏，所以从仓库信息里取
      - name: 构建（按子路径）
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
